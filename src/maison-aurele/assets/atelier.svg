<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" role="img" aria-label="Placeholder : le passe de la cuisine">
  <defs>
    <linearGradient id="atel-bg" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#0F0C08" />
      <stop offset="48%" stop-color="#171009" />
      <stop offset="100%" stop-color="#080706" />
    </linearGradient>

    <radialGradient id="atel-key" cx="0.5" cy="0.3">
      <stop offset="0%" stop-color="#FFDDAC" stop-opacity="0.5" />
      <stop offset="42%" stop-color="#C48A44" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#6B4013" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="atel-pass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9CDBA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6E6252" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="atel-vignette">
      <stop offset="40%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.76" />
    </radialGradient>

    <filter id="atel-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" />
    </filter>

    <filter id="atel-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#atel-bg)" />
  <rect width="1200" height="1600" fill="url(#atel-key)" />

  <!-- Crédence et étagères -->
  <g opacity="0.35" fill="#2A2018">
    <rect x="120" y="260" width="960" height="18" rx="9" />
    <rect x="120" y="520" width="960" height="18" rx="9" />
  </g>
  <g opacity="0.55" fill="#3B2C1C">
    <rect x="200" y="176" width="52" height="84" rx="14" />
    <rect x="278" y="150" width="44" height="110" rx="12" />
    <rect x="348" y="188" width="60" height="72" rx="16" />
    <rect x="812" y="164" width="48" height="96" rx="13" />
    <rect x="884" y="192" width="56" height="68" rx="15" />
  </g>

  <!-- Cuivres suspendus à la crémaillère -->
  <rect x="150" y="392" width="900" height="7" rx="3.5" fill="#4A3823" opacity="0.8" />
  <g opacity="0.75">
    <g fill="#8A5F2C">
      <path d="M312 400 h96 a10 10 0 0 1 10 10 v34 a58 58 0 0 1 -116 0 v-34 a10 10 0 0 1 10 -10 z" />
      <path d="M528 400 h84 a10 10 0 0 1 10 10 v28 a52 52 0 0 1 -104 0 v-28 a10 10 0 0 1 10 -10 z" />
      <path d="M742 400 h104 a10 10 0 0 1 10 10 v38 a62 62 0 0 1 -124 0 v-38 a10 10 0 0 1 10 -10 z" />
    </g>
    <g fill="#C08A45" opacity="0.6">
      <rect x="300" y="412" width="18" height="52" rx="9" />
      <rect x="516" y="410" width="16" height="44" rx="8" />
      <rect x="728" y="414" width="18" height="56" rx="9" />
    </g>
  </g>

  <!-- Lampe du passe -->
  <path d="M600 0 L600 600" stroke="#3A2C1B" stroke-width="4" />
  <ellipse cx="600" cy="612" rx="120" ry="36" fill="#F7DCAD" opacity="0.95" />
  <path d="M540 640 L660 640 L840 1180 L360 1180 Z" fill="#FFD79B" opacity="0.16" filter="url(#atel-blur)" />

  <!-- Le passe -->
  <rect x="60" y="1080" width="1080" height="34" rx="10" fill="url(#atel-pass)" />
  <rect x="60" y="1114" width="1080" height="120" fill="#100B07" opacity="0.85" />

  <!-- Assiettes en cours de dressage -->
  <g>
    <ellipse cx="360" cy="1074" rx="120" ry="34" fill="#EDE3D2" opacity="0.85" />
    <ellipse cx="360" cy="1070" rx="60" ry="16" fill="#8A5F2C" opacity="0.5" />
    <ellipse cx="620" cy="1066" rx="136" ry="38" fill="#EDE3D2" opacity="0.9" />
    <ellipse cx="620" cy="1060" rx="70" ry="18" fill="#6E1C33" opacity="0.55" />
    <ellipse cx="880" cy="1074" rx="112" ry="32" fill="#EDE3D2" opacity="0.8" />
    <ellipse cx="880" cy="1070" rx="54" ry="14" fill="#4F6B3C" opacity="0.5" />
  </g>

  <!-- Silhouettes des cuisiniers -->
  <g fill="#0A0806" opacity="0.92">
    <path d="M170 1180 C 178 1000, 250 940, 300 940 C 352 940, 420 1000, 428 1180 Z" />
    <circle cx="300" cy="898" r="58" />
    <path d="M790 1180 C 796 1024, 856 968, 900 968 C 946 968, 1004 1024, 1010 1180 Z" />
    <circle cx="900" cy="928" r="52" />
  </g>
  <g fill="#E9DDC9" opacity="0.16">
    <path d="M246 966 C 268 950, 334 950, 356 966 L348 1010 L254 1010 Z" />
  </g>

  <!-- Vapeur -->
  <g opacity="0.16" filter="url(#atel-blur)">
    <ellipse cx="620" cy="930" rx="110" ry="150" fill="#FFE9C8" />
    <ellipse cx="880" cy="980" rx="80" ry="110" fill="#FFE9C8" />
  </g>

  <rect width="1200" height="1600" fill="url(#atel-vignette)" />
  <rect width="1200" height="1600" filter="url(#atel-grain)" opacity="0.08" style="mix-blend-mode:overlay" />
</svg>
