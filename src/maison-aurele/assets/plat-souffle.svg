<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Placeholder : soufflé au chocolat">
  <defs>
    <linearGradient id="souf-bg" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#130E08" />
      <stop offset="50%" stop-color="#0B0806" />
      <stop offset="100%" stop-color="#060504" />
    </linearGradient>

    <radialGradient id="souf-key" cx="0.5" cy="0.22">
      <stop offset="0%" stop-color="#FFE3B8" stop-opacity="0.44" />
      <stop offset="46%" stop-color="#C08B45" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#5E3A14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="souf-ramekin" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#F2E8D8" />
      <stop offset="50%" stop-color="#CBBBA2" />
      <stop offset="100%" stop-color="#645646" />
    </linearGradient>

    <linearGradient id="souf-dome" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7A4A24" />
      <stop offset="46%" stop-color="#5A3117" />
      <stop offset="100%" stop-color="#33190C" />
    </linearGradient>

    <radialGradient id="souf-vignette">
      <stop offset="42%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72" />
    </radialGradient>

    <filter id="souf-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" />
    </filter>

    <filter id="souf-blur-s" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <filter id="souf-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="url(#souf-bg)" />
  <rect width="1000" height="1250" fill="url(#souf-key)" />

  <ellipse cx="500" cy="856" rx="330" ry="150" fill="#000000" opacity="0.6" filter="url(#souf-blur)" />

  <!-- Soucoupe -->
  <ellipse cx="500" cy="828" rx="300" ry="140" fill="url(#souf-ramekin)" opacity="0.5" />

  <!-- Ramequin -->
  <path d="M368 616 L392 806 C 396 838, 604 838, 608 806 L632 616 Z" fill="url(#souf-ramekin)" />
  <g stroke="#8B7A62" stroke-opacity="0.55" stroke-width="4" fill="none">
    <path d="M392 660 L608 660" />
    <path d="M398 700 L602 700" />
    <path d="M404 742 L596 742" />
  </g>
  <ellipse cx="500" cy="616" rx="132" ry="40" fill="#E9DDC9" />

  <!-- Soufflé -->
  <path d="M374 606 C 382 486, 448 418, 500 418 C 552 418, 618 486, 626 606 C 590 630, 410 630, 374 606 Z" fill="url(#souf-dome)" />
  <path d="M420 492 C 452 448, 548 448, 580 492" fill="none" stroke="#96603A" stroke-width="10" stroke-linecap="round" opacity="0.55" />
  <ellipse cx="500" cy="602" rx="126" ry="34" fill="#4B2712" opacity="0.5" />

  <!-- Sucre glace -->
  <g fill="#F6EEDF" opacity="0.75">
    <circle cx="446" cy="470" r="4" />
    <circle cx="516" cy="452" r="3" />
    <circle cx="562" cy="504" r="4" />
    <circle cx="418" cy="536" r="3" />
    <circle cx="588" cy="560" r="3" />
    <circle cx="486" cy="512" r="3" />
  </g>

  <!-- Quenelle de glace -->
  <g>
    <path d="M690 780 C 700 736, 762 726, 790 754 C 816 780, 794 818, 752 824 C 714 830, 684 812, 690 780 Z" fill="#EFE2C9" />
    <path d="M706 768 C 730 748, 768 748, 786 764" fill="none" stroke="#FFF8EC" stroke-width="7" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Filet de chocolat -->
  <path d="M262 802 C 308 776, 356 786, 376 812" fill="none" stroke="#4A2A14" stroke-width="14" stroke-linecap="round" opacity="0.8" filter="url(#souf-blur-s)" />

  <!-- Vapeur -->
  <g opacity="0.2" filter="url(#souf-blur)">
    <ellipse cx="470" cy="352" rx="60" ry="90" fill="#FFE9C8" />
    <ellipse cx="546" cy="300" rx="46" ry="76" fill="#FFE9C8" />
  </g>

  <rect width="1000" height="1250" fill="url(#souf-vignette)" />
  <rect width="1000" height="1250" filter="url(#souf-grain)" opacity="0.08" style="mix-blend-mode:overlay" />
</svg>
